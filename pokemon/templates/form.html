{% extends 'base.html' %}
{% block content %}
<div class="col-md-6 mx-auto formulario">
  <h3>{{ titulo|default:"Formulario" }}</h3>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">
      <i class="bi bi-save"></i> Guardar
    </button>
    <a href="{% url cancelar|default:'pokemon_lista' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
