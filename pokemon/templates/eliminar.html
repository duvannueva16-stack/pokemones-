{% extends 'base.html' %}
{% block content %}
<div class="col-md-5 mx-auto formulario text-center">
  <h4>¿Eliminar a {{ objeto }}?</h4>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url cancelar|default:'pokemon_lista' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
