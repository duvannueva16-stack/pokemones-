{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <nav class="navbar barra">
    <div class="container">
      <a class="navbar-brand logo" href="{% url 'pokemon_lista' %}">
        <i class="bi bi-lightning-charge-fill"></i> POKÉDEX
      </a>
      <div class="d-flex gap-2 align-items-center">
        <a class="btn btn-sm btn-light" href="{% url 'pokemon_lista' %}">Pokémon</a>
        <a class="btn btn-sm btn-light" href="{% url 'entrenador_lista' %}">Entrenadores</a>
        <a class="btn btn-sm btn-light" href="{% url 'gimnasio_lista' %}">Gimnasios</a>
      </div>
      <form class="d-flex gap-2" method="get" action="{% url 'pokemon_lista' %}">
        <input class="form-control form-control-sm" name="buscar" placeholder="Buscar...">
        <button class="btn btn-sm btn-warning"><i class="bi bi-search"></i></button>
        <a class="btn btn-sm btn-success" href="{% url 'pokemon_crear' %}">
          <i class="bi bi-plus-circle"></i> Nuevo
        </a>
      </form>
    </div>
  </nav>

  <main class="container my-4">
    {% for m in messages %}
      <div class="alert alert-success animate__animated animate__bounceIn">{{ m }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function clic() {
      const osc = ctx.createOscillator();
      const gan = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 500;
      gan.gain.setValueAtTime(0.15, ctx.currentTime);
      gan.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.connect(gan);
      gan.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    }
    document.querySelectorAll('.btn').forEach(b =>
      b.addEventListener('click', () => { ctx.resume(); clic(); })
    );
  </script>
</body>
</html>
